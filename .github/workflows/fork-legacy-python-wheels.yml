name: Fork Legacy Python Wheels

on:
  workflow_dispatch:
  push:
    tags:
      - "fork-ort-v*"

permissions:
  contents: write

jobs:
  build_linux_cpu_wheel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python_abi: [cp38-cp38, cp39-cp39, cp310-cp310]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build manylinux image
        run: |
          docker build -f tools/ci_build/github/linux/docker/Dockerfile.manylinux2_28_cpu -t ort-manylinux-cpu:local .

      - name: Build wheel for ${{ matrix.python_abi }}
        env:
          PYTHON_ABI: ${{ matrix.python_abi }}
          ORT_PYTHON_REQUIRES: ">=3.8"
        run: |
          set -euxo pipefail
          mkdir -p "$PWD/artifacts"
          case "$PYTHON_ABI" in
            cp38-cp38) PYTHON_EXE="/opt/python/cp38-cp38/bin/python3.8" ;;
            cp39-cp39) PYTHON_EXE="/opt/python/cp39-cp39/bin/python3.9" ;;
            cp310-cp310) PYTHON_EXE="/opt/python/cp310-cp310/bin/python3.10" ;;
            *) echo "Unsupported Python ABI: $PYTHON_ABI"; exit 1 ;;
          esac

          docker run --rm \
            -e ORT_PYTHON_REQUIRES="${ORT_PYTHON_REQUIRES}" \
            -v "$PWD:/onnxruntime_src" \
            -v "$PWD/artifacts:/build" \
            ort-manylinux-cpu:local \
            bash -lc "cd /onnxruntime_src && bash tools/ci_build/github/linux/build_linux_python_package.sh -d CPU -c Release -p ${PYTHON_EXE}"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.python_abi }}
          path: artifacts/dist/*.whl
          if-no-files-found: error

  publish_release:
    if: startsWith(github.ref, 'refs/tags/fork-ort-v')
    needs: build_linux_cpu_wheel
    runs-on: ubuntu-22.04
    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v6
        with:
          path: release-wheels

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-wheels/**/*.whl
